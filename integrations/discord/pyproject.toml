[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kaos-governor-discord"
version = "0.1.0"
description = "Restricted Discord transport for KaosGovernor"
requires-python = ">=3.12"
dependencies = ["discord.py==2.7.1"]

[project.scripts]
kaos-governor-discord = "kaos_governor_discord.main:main"

[tool.setuptools.packages.find]
where = ["src"]
