services:
  governor-discord:
    build:
      context: ../..
      dockerfile: integrations/discord/Dockerfile
      target: runtime
    image: kaosgdd-ai-governor-discord:0.5.0
    container_name: kaos-governor-discord
    restart: unless-stopped
    init: true
    env_file: [.env]
    secrets:
      - governor_api_token
      - memos_access_token
    ports: ["127.0.0.1:8097:8097"]
    volumes:
      - /srv/kaos/data/kaosgdd-ai/governor/mail:/data/mail
      - /srv/kaos/data/kaosgdd-ai/governor/fax:/data/fax
      - /srv/kaos/data/kaosgdd/brain/fax-outgoing:/integrations/fax-outgoing
      - /var/spool/hylafax:/integrations/hylafax:ro
    group_add: ["10", "1000"]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

secrets:
  governor_api_token:
    file: ./secrets/governor_api_token
  memos_access_token:
    file: ./secrets/memos_access_token
