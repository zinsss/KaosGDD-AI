name: kaosgdd-ai

services:
  governor-discord:
    build:
      context: ../..
      dockerfile: integrations/discoord/Dockerfile
      target: runtime
    image: kaosgdd-ai-governor-discord:0.6.0
    pull_policy: never
    container_name: kaos-governor-discord
    restart: unless-stopped
    init: true
    env_file:
      - .env
      - path: ${KAOS_ROOT:-/srv/kaos}/secrets/governor-postgres.env
        format: raw
    environment:
      GOVERNOR_BRAIN_TOOLS_ENABLED: "false"
      GOVERNOR_OPERATION_STORE: "${GOVERNOR_OPERATION_STORE:-postgres}"
      GOVERNOR_DB_HOST: "governor-postgres"
      GOVERNOR_DB_PORT: "5432"
      PUSHOVER_DELIVERY_MODE: "${PUSHOVER_DELIVERY_MODE:-worker}"
      MAIL_NAVER_ENABLED: "false"
      MAIL_NAVER_OWNER: "worker"
      MAIL_ORGANIZER_ENABLED: "false"
      FAX_DISCORD_ENABLED: "false"
      FAX_DISCORD_MESSAGE_INTAKE: "false"
      DAILY_DIGEST_ENABLED: "false"
      DISCORD_CALENDAR_ENABLED: "false"
      DISCORD_TASKS_ENABLED: "false"
      DISCORD_TASK_DUE_NOTIFICATIONS_ENABLED: "false"
      DISCORD_TASK_DUE_REPEAT_NOTIFICATIONS_ENABLED: "false"
      DISCORD_SUPPLIES_ENABLED: "false"
      DISCORD_MEMOS_ENABLED: "false"
      DISCORD_INBOX_ENABLED: "false"
      DISCORD_SERVICE_STATUS_ENABLED: "false"
      DISCORD_STARTUP_NOTIFICATION: "false"
    secrets:
      - discord_bot_token
      - governor_api_token
      - ios_shortcuts_token
      - memos_access_token
      - naver_mail_password
      - paperless_api_token
      - fax_connector_token
      - pushover_app_token
      - pushover_user_key
    ports:
      - "${GOVERNOR_BIND_ADDRESS:-127.0.0.1}:${HEALTH_PORT:-8097}:8097"
    volumes:
      - ${GOVERNOR_STATE_ROOT:-/srv/kaos/data/kaosgdd-ai/governor}/mail:/data/mail
      - ${GOVERNOR_STATE_ROOT:-/srv/kaos/data/kaosgdd-ai/governor}/fax:/data/fax
      - ${GOVERNOR_STATE_ROOT:-/srv/kaos/data/kaosgdd-ai/governor}/discord-calendar:/data/discord-calendar
      - ${GOVERNOR_STATE_ROOT:-/srv/kaos/data/kaosgdd-ai/governor}/discord-tasks:/data/discord-tasks
      - ${GOVERNOR_STATE_ROOT:-/srv/kaos/data/kaosgdd-ai/governor}/discord-supplies:/data/discord-supplies
      - ${GOVERNOR_STATE_ROOT:-/srv/kaos/data/kaosgdd-ai/governor}/discord-inbox:/data/discord-inbox
      - ${GOVERNOR_STATE_ROOT:-/srv/kaos/data/kaosgdd-ai/governor}/discord-system:/data/discord-system
      - ${GOVERNOR_STATE_ROOT:-/srv/kaos/data/kaosgdd-ai/governor}/notifications:/data/notifications
    group_add:
      - "${KAOS_HOST_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
    networks:
      - backend

  governor-worker:
    build:
      context: ../..
      dockerfile: apps/governor/Dockerfile
      target: runtime
    image: kaosgdd-ai-governor-worker:0.3.0
    pull_policy: never
    container_name: kaos-governor-worker
    restart: unless-stopped
    init: true
    env_file:
      - .env
      - path: ${KAOS_ROOT:-/srv/kaos}/secrets/governor-postgres.env
        format: raw
    environment:
      PUSHOVER_DELIVERY_MODE: "${PUSHOVER_DELIVERY_MODE:-worker}"
      GOVERNOR_DB_HOST: "governor-postgres"
      GOVERNOR_DB_PORT: "5432"
      RECURRING_TASK_SYNC_ENABLED: "${RECURRING_TASK_SYNC_ENABLED:-true}"
      RECURRING_TASK_SYNC_POLL_SECONDS: "${RECURRING_TASK_SYNC_POLL_SECONDS:-300}"
    secrets:
      - naver_mail_password
      - fax_connector_token
      - web_push_vapid_private_key
      - pushover_app_token
      - pushover_user_key
    volumes:
      - ${GOVERNOR_STATE_ROOT:-/srv/kaos/data/kaosgdd-ai/governor}/mail:/data/mail
      - ${GOVERNOR_STATE_ROOT:-/srv/kaos/data/kaosgdd-ai/governor}/fax:/data/fax
      - ${GOVERNOR_STATE_ROOT:-/srv/kaos/data/kaosgdd-ai/governor}/notifications:/data/notifications
    group_add:
      - "${KAOS_HOST_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp:size=96m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 50
    logging:
      driver: json-file
      options:
        max-size: 2m
        max-file: "2"
    networks:
      - backend

  governor-tools:
    build:
      context: ../..
      dockerfile: apps/governor/Dockerfile
      target: runtime
    image: kaosgdd-ai-governor-tools:0.3.0
    pull_policy: never
    container_name: kaos-governor-tools
    restart: unless-stopped
    init: true
    env_file:
      - .env
      - path: ${KAOS_ROOT:-/srv/kaos}/secrets/governor-postgres.env
        format: raw
    environment:
      GOVERNOR_DB_HOST: "governor-postgres"
      GOVERNOR_DB_PORT: "5432"
      GOVERNOR_TOOLS_HOST: "0.0.0.0"
      GOVERNOR_TOOLS_PORT: "8098"
      GOVERNOR_TOOLS_STATE_PATH: "/data/tools/second-look-status.json"
      GOVERNOR_WORKER_STATE_PATH: "/data/notifications/governor-worker.json"
      FAX_PROPOSAL_STAGE_ROOT: "/data/tools/fax-proposals"
      IOS_FAX_SHORTCUT_TOKEN_FILE: "/run/secrets/ios_fax_shortcut_token"
    entrypoint: ["kaos-governor-tools"]
    secrets:
      - governor_api_token
      - ios_shortcuts_token
      - ios_fax_shortcut_token
      - memos_access_token
      - naver_mail_password
      - paperless_api_token
      - fax_connector_token
      - web_push_vapid_private_key
    ports:
      - "${GOVERNOR_BRAIN_TOOLS_BIND_ADDRESS:-127.0.0.1}:${GOVERNOR_BRAIN_TOOLS_PORT:-8098}:8098"
    volumes:
      - ${GOVERNOR_STATE_ROOT:-/srv/kaos/data/kaosgdd-ai/governor}/mail:/data/mail:ro
      - ${GOVERNOR_STATE_ROOT:-/srv/kaos/data/kaosgdd-ai/governor}/fax:/data/fax
      - ${GOVERNOR_STATE_ROOT:-/srv/kaos/data/kaosgdd-ai/governor}/notifications:/data/notifications
      - ${GOVERNOR_STATE_ROOT:-/srv/kaos/data/kaosgdd-ai/governor}/tools:/data/tools
    group_add:
      - "${KAOS_HOST_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp:size=96m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 50
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8098/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 2m
        max-file: "2"
    networks:
      - backend

networks:
  backend:
    name: kaosgdd-backend

secrets:
  discord_bot_token:
    file: ./secrets/discord_bot_token
  governor_api_token:
    file: ./secrets/governor_api_token
  ios_shortcuts_token:
    file: ./secrets/ios_shortcuts_token
  ios_fax_shortcut_token:
    file: ./secrets/ios_fax_shortcut_token
  memos_access_token:
    file: ./secrets/memos_access_token
  naver_mail_password:
    file: ./secrets/naver_mail_password
  paperless_api_token:
    file: ./secrets/paperless_api_token
  fax_connector_token:
    file: ./secrets/fax_connector_token
  pushover_app_token:
    file: ./secrets/pushover_app_token
  pushover_user_key:
    file: ./secrets/pushover_user_key
  web_push_vapid_private_key:
    file: ./secrets/web_push_vapid_private_key
