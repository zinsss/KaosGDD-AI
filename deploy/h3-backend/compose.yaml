name: kaosgdd-ai

services:
  governor-worker:
    build:
      context: ../..
      dockerfile: apps/governor/Dockerfile
      target: runtime
    image: kaosgdd-ai-governor-worker:0.3.0
    pull_policy: never
    container_name: kaos-governor-worker
    restart: unless-stopped
    init: true
    env_file:
      - secrets/governor-runtime.env
      - path: ${KAOS_ROOT:-/srv/kaos}/secrets/governor-postgres.env
        format: raw
    environment:
      PUSHOVER_DELIVERY_MODE: "${PUSHOVER_DELIVERY_MODE:-worker}"
      GOVERNOR_DB_HOST: "governor-postgres"
      GOVERNOR_DB_PORT: "5432"
      RECURRING_TASK_SYNC_ENABLED: "${RECURRING_TASK_SYNC_ENABLED:-true}"
      RECURRING_TASK_SYNC_POLL_SECONDS: "${RECURRING_TASK_SYNC_POLL_SECONDS:-300}"
      MAIL_NAVER_NOTIFICATION_FOLDERS: "${MAIL_NAVER_NOTIFICATION_FOLDERS:-세무사,영덕군보건소}"
      SYSTEM_MAINTENANCE_REPORT_PATH: "/data/notifications/maintenance-report.json"
      SYSTEM_MAINTENANCE_REMINDER_STATE_PATH: "/data/notifications/maintenance-reminders.json"
    secrets:
      - naver_mail_password
      - fax_connector_token
      - web_push_vapid_private_key
      - pushover_app_token
      - pushover_user_key
    volumes:
      - ${GOVERNOR_STATE_ROOT:-/srv/kaos/data/kaosgdd-ai/governor}/mail:/data/mail
      - ${GOVERNOR_STATE_ROOT:-/srv/kaos/data/kaosgdd-ai/governor}/fax:/data/fax
      - ${GOVERNOR_STATE_ROOT:-/srv/kaos/data/kaosgdd-ai/governor}/notifications:/data/notifications
    group_add:
      - "${KAOS_HOST_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp:size=96m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 50
    logging:
      driver: json-file
      options:
        max-size: 2m
        max-file: "2"
    networks:
      - backend

  governor-tools:
    build:
      context: ../..
      dockerfile: apps/governor/Dockerfile
      target: runtime
    image: kaosgdd-ai-governor-tools:0.3.0
    pull_policy: never
    container_name: kaos-governor-tools
    restart: unless-stopped
    init: true
    env_file:
      - secrets/governor-runtime.env
      - path: ${KAOS_ROOT:-/srv/kaos}/secrets/governor-postgres.env
        format: raw
    environment:
      GOVERNOR_DB_HOST: "governor-postgres"
      GOVERNOR_DB_PORT: "5432"
      GOVERNOR_TOOLS_HOST: "0.0.0.0"
      GOVERNOR_TOOLS_PORT: "8098"
      GOVERNOR_TOOLS_STATE_PATH: "/data/tools/second-look-status.json"
      GOVERNOR_WORKER_STATE_PATH: "/data/notifications/governor-worker.json"
      FAX_PROPOSAL_STAGE_ROOT: "/data/tools/fax-proposals"
      SCRIBBLE_STATE_PATH: "/data/scribble/index.json"
      IOS_FAX_SHORTCUT_TOKEN_FILE: "/run/secrets/ios_fax_shortcut_token"
      IOS_SCRIBBLE_SHORTCUT_TOKEN_FILE: "/run/secrets/ios_scribble_shortcut_token"
      IOS_PAPERLESS_SHORTCUT_TOKEN_FILE: "/run/secrets/ios_paperless_shortcut_token"
    entrypoint: ["kaos-governor-tools"]
    secrets:
      - governor_api_token
      - ios_shortcuts_token
      - ios_fax_shortcut_token
      - ios_scribble_shortcut_token
      - ios_paperless_shortcut_token
      - memos_access_token
      - naver_mail_password
      - paperless_api_token
      - fax_connector_token
      - web_push_vapid_private_key
    ports:
      - "${GOVERNOR_BRAIN_TOOLS_BIND_ADDRESS:-127.0.0.1}:${GOVERNOR_BRAIN_TOOLS_PORT:-8098}:8098"
    volumes:
      - ${GOVERNOR_STATE_ROOT:-/srv/kaos/data/kaosgdd-ai/governor}/mail:/data/mail:ro
      - ${GOVERNOR_STATE_ROOT:-/srv/kaos/data/kaosgdd-ai/governor}/fax:/data/fax
      - ${GOVERNOR_STATE_ROOT:-/srv/kaos/data/kaosgdd-ai/governor}/notifications:/data/notifications
      - ${GOVERNOR_STATE_ROOT:-/srv/kaos/data/kaosgdd-ai/governor}/tools:/data/tools
      - ${GOVERNOR_STATE_ROOT:-/srv/kaos/data/kaosgdd-ai/governor}/scribble:/data/scribble
      - ${GOVERNOR_STATE_ROOT:-/srv/kaos/data/kaosgdd-ai/governor}/documents:/data/documents
    group_add:
      - "${KAOS_HOST_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp:size=96m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 50
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8098/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 2m
        max-file: "2"
    networks:
      - backend

networks:
  backend:
    name: kaosgdd-backend

secrets:
  governor_api_token:
    file: ./secrets/governor_api_token
  ios_shortcuts_token:
    file: ./secrets/ios_shortcuts_token
  ios_scribble_shortcut_token:
    file: ./secrets/ios_scribble_shortcut_token
  ios_paperless_shortcut_token:
    file: ./secrets/ios_paperless_shortcut_token
  ios_fax_shortcut_token:
    file: ./secrets/ios_fax_shortcut_token
  memos_access_token:
    file: ./secrets/memos_access_token
  naver_mail_password:
    file: ./secrets/naver_mail_password
  paperless_api_token:
    file: ./secrets/paperless_api_token
  fax_connector_token:
    file: ./secrets/fax_connector_token
  pushover_app_token:
    file: ./secrets/pushover_app_token
  pushover_user_key:
    file: ./secrets/pushover_user_key
  web_push_vapid_private_key:
    file: ./secrets/web_push_vapid_private_key
