[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kaos-brain"
version = "0.1.0"
description = "Lightweight KaosBrain Discord and Ollama service"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.10,<4", "discord.py==2.7.1"]

[project.scripts]
kaos-brain = "kaos_brain.main:main"

[tool.setuptools.packages.find]
where = ["src"]
