[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kaos-brain"
version = "0.1.0"
description = "Headless KaosBrain HTTP and AI orchestration service"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.10,<4"]

[project.scripts]
kaos-brain = "kaos_brain.main:main"
kaos-openclaw-reauth-agent = "kaos_brain.openclaw_reauth_agent:main"

[tool.setuptools.packages.find]
where = ["src"]
