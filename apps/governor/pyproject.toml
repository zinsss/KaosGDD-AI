[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kaos-governor"
version = "0.3.0"
description = "Deterministic KaosGovernor domain services"
requires-python = ">=3.12"
dependencies = ["Pillow>=10,<13"]

[tool.setuptools.packages.find]
where = ["src"]
