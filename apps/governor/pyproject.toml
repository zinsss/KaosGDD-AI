[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kaos-governor"
version = "0.3.0"
description = "Deterministic KaosGovernor domain services"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=43,<47",
    "openpyxl>=3.1,<4",
    "Pillow>=10,<13",
    "psycopg[binary]>=3.2,<4",
    "PyJWT[crypto]>=2.10,<3",
    "pypdf>=5,<7",
]

[project.scripts]
kaos-governor-api = "kaos_governor.api:main"
kaos-governor-worker = "kaos_governor.worker:main"

[tool.setuptools.packages.find]
where = ["src"]
