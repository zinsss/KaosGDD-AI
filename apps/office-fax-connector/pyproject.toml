[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kaos-office-fax-connector"
version = "0.1.0"
description = "Authenticated Office Kaos HylaFAX connector for KaosGovernor"
requires-python = ">=3.12"

[project.scripts]
kaos-office-fax-connector = "kaos_office_fax_connector.main:main"

[tool.setuptools.packages.find]
where = ["src"]
