name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  container-tests:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kaos_governor_test
          POSTGRES_USER: kaos_governor_test
          POSTGRES_PASSWORD: phase2-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kaos_governor_test -d kaos_governor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Validate shell scripts
        run: |
          bash -n deploy/h3-backend/kaos-h3
          bash -n deploy/kaosbrain/kaosbrain
          bash -n deploy/office-fax-connector/kaos-office-fax
          unit_dir=$(mktemp -d)
          sed \
            -e 's|__KAOS_DEPLOY_USER__|runner|g' \
            -e 's|__KAOS_DEPLOY_HOME__|/home/runner|g' \
            deploy/h3-backend/kaos-h3-maintenance-report.service \
            > "${unit_dir}/kaos-h3-maintenance-report.service"
          cp deploy/h3-backend/kaos-h3-maintenance-report.timer \
            "${unit_dir}/kaos-h3-maintenance-report.timer"
          systemd-analyze verify \
            "${unit_dir}/kaos-h3-maintenance-report.service" \
            "${unit_dir}/kaos-h3-maintenance-report.timer"
      - name: Validate KaosGDD PWA JavaScript
        run: |
          node --check apps/family-portal/deep-links.js
          node --check apps/family-portal/documents.js
          node --check apps/family-portal/navigation.js
          node --check apps/family-portal/web-push.js
          node --check apps/family-portal/sw.js
          node --check apps/family-portal/app.js
          node --test tests/family-portal/*.cjs
          node --test tests/deploy/*.cjs
      - name: Render H3 deployment
        run: |
          cp deploy/h3-backend/.env.example deploy/h3-backend/.env
          sed -i \
            -e "s|^KAOS_ROOT=.*|KAOS_ROOT=${GITHUB_WORKSPACE}/.ci-kaos|" \
            deploy/h3-backend/.env
          mkdir -p "${GITHUB_WORKSPACE}/.ci-kaos/secrets"
          printf 'POSTGRES_DB=kaos_governor_test\nPOSTGRES_USER=kaos_governor_test\nPOSTGRES_PASSWORD=phase2-test-password\n' \
            > "${GITHUB_WORKSPACE}/.ci-kaos/secrets/governor-postgres.env"
          printf 'POSTGRES_DB=n8n\nPOSTGRES_USER=n8n\nPOSTGRES_PASSWORD=test\nDB_POSTGRESDB_DATABASE=n8n\nDB_POSTGRESDB_USER=n8n\nDB_POSTGRESDB_PASSWORD=test\nN8N_ENCRYPTION_KEY=test-test-test-test\n' \
            > "${GITHUB_WORKSPACE}/.ci-kaos/secrets/n8n.env"
          mkdir -p "${GITHUB_WORKSPACE}/.ci-kaos/data/n8n" "${GITHUB_WORKSPACE}/.ci-kaos/data/n8n-postgres"
          printf 'test\n' > deploy/h3-backend/secrets/governor_api_token
          : > deploy/h3-backend/secrets/memos_access_token
          : > deploy/h3-backend/secrets/naver_mail_password
          : > deploy/h3-backend/secrets/paperless_api_token
          : > deploy/h3-backend/secrets/fax_connector_token
          openssl ecparam -name prime256v1 -genkey -noout > deploy/h3-backend/secrets/web_push_vapid_private_key
          ./deploy/h3-backend/kaos-h3 config >/dev/null
          docker compose \
            --project-directory deploy/h3-backend \
            --env-file deploy/h3-backend/.env \
            -f deploy/h3-backend/compose.yaml \
            config --quiet
          docker compose \
            --project-directory deploy/h3-backend \
            --env-file deploy/h3-backend/.env \
            -f deploy/h3-backend/compose.yaml \
            -f deploy/h3-backend/compose.n8n.yaml \
            config --quiet
      - name: Render Office fax connector deployment
        run: |
          cp deploy/office-fax-connector/.env.example deploy/office-fax-connector/.env
          mkdir -p deploy/office-fax-connector/secrets
          printf 'test\n' > deploy/office-fax-connector/secrets/fax_connector_token
          docker compose \
            --project-directory deploy/office-fax-connector \
            --env-file deploy/office-fax-connector/.env \
            -f deploy/office-fax-connector/compose.yaml \
            config --quiet
      - name: Build test image
        run: docker build --target test --tag kaosgdd-ai-governor:test --file apps/governor/Dockerfile .
      - name: Run tests
        run: docker run --rm kaosgdd-ai-governor:test
      - name: Run PostgreSQL Governor contract tests
        run: |
          docker run --rm --network host \
            -e GOVERNOR_TEST_POSTGRES=true \
            -e GOVERNOR_DB_HOST=127.0.0.1 \
            -e GOVERNOR_DB_PORT=5432 \
            -e GOVERNOR_DB_NAME=kaos_governor_test \
            -e GOVERNOR_DB_USER=kaos_governor_test \
            -e GOVERNOR_DB_PASSWORD=phase2-test-password \
            kaosgdd-ai-governor:test \
            sh -c 'cd /tests/governor && python -m unittest -v test_postgres_durable'
      - name: Build Office fax connector test image
        run: docker build --target test --tag kaos-office-fax-connector:test --file apps/office-fax-connector/Dockerfile .
      - name: Run Office fax connector tests
        run: docker run --rm kaos-office-fax-connector:test
      - name: Build Brain test image
        run: docker build --target test --tag kaos-brain:test --file apps/brain/Dockerfile .
      - name: Run Brain tests
        run: docker run --rm kaos-brain:test
